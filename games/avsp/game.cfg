# Alien vs. Predator (Capcom 1994, CPS-2 arcade board): per-game settings read by the cps2recomp
# toolkit (Makefile, tools and launcher via cps2recomp/tools/gamecfg.py).

name = Alien vs. Predator
# What the window is called (the name stays the folder the player's settings are kept under)
title = Alien vs. Predator Recomp
id = avsp
# Reverse-DNS app identifier (macOS bundle id / launcher).
app_id = io.github.omegakatana92.avsp
disclaimer = Not affiliated with Capcom.

# The ROM set this port is made from, as arcade ROM collections name it, and the name the launcher shows.
# `avsp` is MAME's parent set (Europe 940520); its clones (avspa, avspj, avspu) are built from it.
rom_set = avsp
rom_parent = avsp
rom_name = Alien vs. Predator (Europe 940520)

# The set's files, each with its CRC32 (file:crc ...), in the order they sit on the board.
# program: the 68000's ROMs (16-bit words, four 512 KiB files: 2 MiB). graphics: four files side by
# side per row (64-bit words). sound_program: the Z80's ROMs. samples: the QSound chip's.
# key: the board's cipher key.
program = avpe.03d:774334a9 avpe.04d:7fa83769 avp.05d:fbfb5d7a avp.06:190b817f
graphics = avp.13m:8f8b5ae4 avp.15m:b00280df avp.17m:94403195 avp.19m:e1981245 avp.14m:39933b1e avp.16m:85412860 avp.18m:2e2beb06 avp.20m:e4798d1a
sound_program = avp.01:2d3b4220
samples = avp.11m:83499817 avp.12m:f4110d49
key = avsp.key:e69fa35b

# Where the game's code ends in the 68000's ROM (hex): the translator does not look past this. The
# maincpu region is 2 MiB (four 512 KiB ROMs), so this spans the whole program.
code_end = 200000
